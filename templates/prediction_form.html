<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGI.R - Price Prediction</title>
    <style>
        /* --- PREMIUM DARK THEME VARIABLES --- */
        :root {
            --bg-color: #0f172a;       
            --card-bg: #1e293b;        
            --accent: #38bdf8;         
            --text-main: #f1f5f9;      
            --text-muted: #94a3b8;     
            --success: #10b981;        
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            background: linear-gradient(90deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-top: 10px;
        }

        /* --- Main Card Container --- */
        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- Form Styling --- */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, var(--accent), #3b82f6);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }

        .car-image {
            width: 100%;
            height: 200px;
            background-color: #000;
            border-radius: 10px;
            margin-bottom: 20px;
            object-fit: cover;
            border: 1px solid #334155;
        }
        
        /* Navigation Links (Updated for the new routes) */
        nav {
            margin-bottom: 30px;
        }
        nav a {
            color: var(--text-main);
            text-decoration: none;
            padding: 10px 15px;
            margin: 0 10px;
            border-radius: 5px;
            transition: 0.3s;
        }
        nav a:hover {
            background-color: var(--accent);
            color: var(--bg-color);
        }
    </style>
</head>
<body>
    <header>
        <h1>CGI.R Auto Intelligence</h1>
        <p class="subtitle">Enter Car Specs for Market Valuation</p>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/prediction">Predict</a>
        <a href="/recommendation">Recommend</a>
        <a href="/explore">Explore</a>
        <a href="/contact">Contact</a>
    </nav>

    <div class="container">
        <img src="https://placehold.co/600x300/1e293b/38bdf8?text=Enter+Car+Specs" alt="Car Preview" class="car-image">

        <form action="/predict" method="post">
            
            <div class="form-group">
                <label>Car Brand</label>
                <select name="brand" required>
                    <option value="" disabled selected>Select Brand</option>
                    {% for brand in features.brands %}
                        <option value="{{ brand | lower }}">{{ brand | title }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Body Type</label>
                <select name="cartype" required>
                    {% for type in features.cartypes %}
                        <option value="{{ type | lower }}">{{ type | title }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Fuel Type</label>
                <select name="fueltype" required>
                    {% for fuel in features.fueltypes %}
                        <option value="{{ fuel | lower }}">{{ fuel | title }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Engine Size (Liters)</label>
                <input type="number" step="0.1" name="enginesize" placeholder="e.g. 2.5" required>
            </div>

            <div class="form-group">
                <label>Vehicle Status</label>
                <select name="status" required>
                    {% for status in features.statuses %}
                        <option value="{{ status | lower }}">{{ status | title }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label>Model Year</label>
                <input type="number" name="year" placeholder="e.g. 2022" min="1990" max="2024" required>
            </div>

            <div class="form-group">
                <label>Mileage (km)</label>
                <input type="number" name="mileage" placeholder="e.g. 50000" min="0" required>
            </div>

            <button type="submit">🔮 Predict Market Value</button>
        </form>
    </div>
    <a href="/" style="display: block; margin-top: 20px; color: var(--text-muted);">⬅ Back to Options</a>

</body>
</html>
